# PID gains mujoco_ros2_control uses to drive the arm's pure-torque MuJoCo
# actuators (fer_joint1..7, see panda.xml) when a position or velocity
# ros2_control command interface is active instead of effort. Keyed by MJCF
# *joint* name ("joint1".."joint7"), not the ros2_control "fer_jointN" names --
# mujoco_ros2_control looks these up by the underlying MuJoCo joint the
# actuator drives.
#
# The position gains reproduce the original MuJoCo position-actuator PD gains
# that used to live directly on actuator1..7 in panda.xml (gainprm/biasprm),
# before they were replaced by these torque actuators so effort/impedance
# control could command real torque without fighting a second, always-on
# position actuator on the same joint.
/**:
  ros__parameters:
    pid_gains:
      position:
        fer_joint1: {p: 450.0, i: 0.0, d: 45.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint2: {p: 450.0, i: 0.0, d: 45.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint3: {p: 350.0, i: 0.0, d: 35.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint4: {p: 350.0, i: 0.0, d: 35.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint5: {p: 200.0, i: 0.0, d: 20.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint6: {p: 200.0, i: 0.0, d: 20.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint7: {p: 200.0, i: 0.0, d: 20.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
      velocity:
        fer_joint1: {p: 50.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint2: {p: 50.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint3: {p: 50.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint4: {p: 50.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint5: {p: 20.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint6: {p: 20.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
        fer_joint7: {p: 20.0, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: false}
