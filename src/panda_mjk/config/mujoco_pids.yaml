# This file is used if mujoco_ros2_control needs to run software PID loops 
# to convert position/velocity commands to effort commands.
# Since mujoco_menagerie's panda.xml uses <position> actuators, this might not be fully utilized, 
# but it's good practice to provide it to avoid warnings.
mujoco_ros2_control:
  ros__parameters:
    # Intentionally left blank. Do not define `pids` here.
    # Since mujoco_menagerie's panda.xml uses <position> actuators, 
    # we want mujoco_ros2_control to pass the position commands directly 
    # to the MuJoCo actuators, rather than running a software PID loop 
    # that calculates an effort and incorrectly sets it as the position setpoint.
    use_sim_time: true
