# This file is used if mujoco_ros2_control needs to run software PID loops 
# to convert position/velocity commands to effort commands.
# Since mujoco_menagerie's panda.xml uses <position> actuators, this might not be fully utilized, 
# but it's good practice to provide it to avoid warnings.
mujoco_ros2_control:
  ros__parameters:
    pids:
      joint1: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      joint2: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      joint3: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      joint4: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      joint5: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      joint6: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      joint7: {p: 100.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      finger_joint1: {p: 100.0, i: 0.0, d: 1.0, i_clamp: 0.0}
