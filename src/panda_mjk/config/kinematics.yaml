# MoveIt kinematics solver config for the "arm" planning group defined in
# franka_description's fer.srdf.xacro (base_link: fer_link0, tip_link: fer_link8).
# Note: this is unrelated to franka_description's own robots/fer/kinematics.yaml,
# which is Franka's internal DH-parameter format for libfranka's analytic model,
# not a MoveIt kinematics_solver plugin config.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
