/**:
  ros__parameters:
    moveit_servo:
      use_gazebo: false                     # We use MuJoCo, not Gazebo
      low_latency_mode: false
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
      # No separate move_group node is run, so Servo's own PlanningSceneMonitor
      # is the primary one (advertises /get_planning_scene).
      is_primary_planning_scene_monitor: true
      num_outgoing_halt_msgs_to_publish: 4

      # Kinematic properties
      # "arm" matches the group name in franka_description's fer.srdf.xacro
      # (base_link: fer_link0, tip_link: fer_link8) -- not "panda_arm".
      move_group_name: arm
      planning_frame: fer_link0
      ee_frame_name: fer_link8
      robot_link_command_frame: fer_link0

      # Topic Configuration
      cartesian_command_in_topic: ~/delta_twist_cmds
      joint_command_in_topic: ~/delta_joint_cmds
      pose_command_in_topic: ~/pose_target_cmds
      joint_topic: /joint_states
      status_topic: ~/status

      # Controller Output Configuration
      # Since we stream positions, we output to forward_position_controller
      command_out_topic: /forward_position_controller/commands
      command_out_type: std_msgs/Float64MultiArray

      # Servo timing and rates
      publish_period: 0.01                  # 100 Hz control loop (or 1000 Hz if you want 0.001)
      incoming_command_timeout: 0.1         # Halt if no command received for 100ms
      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false

      # Input command scaling
      command_in_type: "speed_units"
      scale:
        linear: 0.4                         # Max linear speed (m/s) for unitless scale=1.0
        rotational: 0.8                     # Max angular speed (rad/s)
        joint: 0.5                          # Max joint speed (rad/s)

      # Singularity handling thresholds
      lower_singularity_threshold: 100.0     # Decelerate when condition number exceeds this
      hard_stop_singularity_threshold: 101.0 # Stop when condition number exceeds this

      # Safety margins and limits
      joint_limit_margin: 0.0              # Safety buffer from hard joint limits in radians

      # Collision Checking
      check_collisions: false
      collision_check_rate: 10.0            # Rate (Hz) to run planning scene collision checks
      self_collision_proximity_threshold: 0.01  # Distance (m) to start decelerating
      scene_collision_proximity_threshold: 0.02 # Distance (m) to start decelerating
