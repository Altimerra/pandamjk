controller_manager:
  ros__parameters:
    update_rate: 1000  # 1 kHz loop for FCI

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    # Gripper controller for MuJoCo simulation
    panda_gripper_controller:
      type: position_controllers/GripperActionController

forward_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    interface_name: position

panda_gripper_controller:
  ros__parameters:
    action_monitor_rate: 20.0
    joint: finger_joint1
    # MuJoCo Menagerie handles finger_joint2 mimic via tendon equality constraint
    goal_tolerance: 0.01
    stalled_velocity_threshold: 0.001
    stall_timeout: 0.5
